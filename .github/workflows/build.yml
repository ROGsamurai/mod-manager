name: Build

# Builds the Linux AppImage and the Windows portable .exe.
#
# Runs on every push to main, on any tag starting with "v", and on demand from
# the Actions tab (Run workflow). Tagging a release like "v1.1.1" also attaches
# both builds to a GitHub Release automatically.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 42 and its @electron/get declare "node >= 22.12.0"; on 20
          # every install printed EBADENGINE warnings. Your local Node is 24, so
          # this also keeps CI and your machine on the same major.
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins, so the build can't
      # drift onto a newer electron-builder (which ships a different portable
      # stub and has triggered antivirus false positives in the past).
      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build AppImage
        # electron-builder 26 for Linux specifically: it understands
        # toolsets.appimage, which swaps the 2019 FUSE2 runtime for the static
        # type2-runtime. The old one dlopens libfuse.so.2 at startup, so the
        # AppImage refused to launch on anything that ships only FUSE3 — Arch,
        # Fedora, Ubuntu 24.04 and up.
        #
        # Windows stays pinned to 24.13.3 below: that pin is about the portable
        # .exe stub and antivirus false positives, which has nothing to do with
        # the Linux target.
        # toolsets is passed here rather than in package.json: electron-builder
        # rejects config keys it does not recognise, and the 24.13.3 pinned for
        # the Windows build predates this option.
        run: npx electron-builder@26.16.1 --linux --publish never --config.toolsets.appimage=1.0.3
        env:
          # electron-builder tries to reach GitHub for update metadata otherwise
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/*.AppImage
          if-no-files-found: error
          compression-level: 0   # the AppImage is already compressed
          retention-days: 3      # just long enough for the release job

  windows:
    name: Windows (portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 42 and its @electron/get declare "node >= 22.12.0"; on 20
          # every install printed EBADENGINE warnings. Your local Node is 24, so
          # this also keeps CI and your machine on the same major.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build portable exe
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/*.exe
          if-no-files-found: error
          compression-level: 0   # the portable exe is already compressed
          retention-days: 3

  release:
    name: Attach builds to release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/windows-portable/*.exe
          draft: true
          generate_release_notes: true

      # Release assets are not Actions artifact storage, so once the builds are
      # attached to the release the artifacts are pure overhead. On a private
      # repo they would otherwise sit against the 500 MB allowance until their
      # retention expires.
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            linux-appimage
            windows-portable
          failOnError: false
